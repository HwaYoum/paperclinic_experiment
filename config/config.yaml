# AES Fine-tuning Configuration

model:
  base_model: "upstage/SOLAR-10.7B-Instruct-v1.0"
  max_length: 1024

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "gate_proj"
    - "up_proj"
    - "down_proj"
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  output_dir: "aes_finetuned"
  num_train_epochs: 3
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  optim: "paged_adamw_8bit"
  logging_steps: 25
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  warmup_ratio: 0.03
  fp16: true
  group_by_length: true
